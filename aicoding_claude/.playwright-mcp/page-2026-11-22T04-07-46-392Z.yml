      - img "AIエージェントとは？仕組みや生成AIとの違い、ユースケースを紹介" [ref=f29e24]
      - generic [ref=f29e25]:
        - heading "AIエージェントとは？仕組みや生成AIとの違い、ユースケースを紹介" [level=1] [ref=f29e27]
        - paragraph [ref=f29e30]
      - paragraph [ref=f29e34]: 企業経営に携わる方々のなかには「AI活用で業務の生産性をより高められるだろうか？」「新たなサービスを生み出すチャンスにつなげたい」といった、AI活用に対する期待をお持ちの方も多いのではないでしょうか。 近年、自律して業務を行ってくれる「AIエージェント」への注目が高まっています。本記事では、AIエージェントについて基礎から生成AIとの違い、メリット、課題、ユースケースまでをわかりやすくご紹介します。
    - generic [ref=f29e36]:
      - generic [ref=f29e39]:
        - heading "1．AIエージェントとは" [level=2] [ref=f29e41]
        - article [ref=f29e42]:
          - generic [ref=f29e43]:
            - paragraph [ref=f29e44]: AIエージェントとは、人が事細かく指示を与えなくても、業務の目標を理解したAIが自ら計画を立て、さまざまなツールを自動的に使い分けながらタスクに取り組む高度な自律型ソフトウェアを指します。
            - paragraph [ref=f29e45]: 昨今、「生成AI」が身近な存在となり日常的に活用する人も増えています。生成AIの主な目的はテキストや画像、音声といった新しいコンテンツを生み出すことです。
            - paragraph [ref=f29e46]: 対するAIエージェントは、特定の業務目標を達成するために自律的に意思決定を行い、実行を繰り返すことで環境に適応し、問題解決や目標達成に向けて自律的に動作する点が特徴です。
            - paragraph [ref=f29e47]: たとえば、コールセンターでAIエージェントを使用するケースを想定してみましょう。オペレーターと顧客の通話中、AIエージェントは次のようなタスクを自動で行ってくれます。
            - list [ref=f29e48]:
              - listitem [ref=f29e49]: 会話内容に基づき、FAQのリアルタイム検索を自動で実施
              - listitem [ref=f29e50]: 通話後に会話を要約し、必要に応じて共有のためのナレッジを作成する
            - paragraph [ref=f29e51]: 基本的にはオペレーターの指示なしで、一連のタスクをすべて自動で行うことが可能です。このようにAIエージェントを活用することで業務効率化につながり、オペレーターは応対品質の向上など、本来取り組むべき業務に集中しやすくなると期待できます。
        - article [ref=f29e52]:
          - heading "①AIエージェントの仕組み" [level=3] [ref=f29e54]
          - generic [ref=f29e55]:
            - paragraph [ref=f29e56]: AIエージェントは、与えられた目標を達成するために「Web検索」「ファイルの書き込み・読み込み」「WebAPIとの連携」など複数の外部ツールを活用し、各ツールの実行結果やエラー内容に基づいて自己修正を行いながらタスクを完了させる仕組みです。
            - paragraph [ref=f29e57]: たとえば、ユーザーが「◯◯需要の予測レポートを作成」するようAIエージェントにタスクを依頼したケースを想定してみましょう。
            - paragraph [ref=f29e58]:
              - text: 業務目標を理解したAIエージェントは、社内で保管されているファイルの読み込みやWeb検索、プログラム実行、LLM
              - superscript [ref=f29e59]: ※1
              - text: による分析・生成など、複数のツールを組み合わせながら、レポートを自動で作成することが可能です。
            - figure "※1 LLM（Large Language Models）…「大規模言語モデル」のことで、言語に特化した生成AIモデルの一種。文章を理解・作成できる。" [ref=f29e60]:
              - img "AIエージェント 利用のイメージ図" [ref=f29e61]
        - article [ref=f29e63]:
          - heading "②AIエージェントの種類" [level=3] [ref=f29e65]
          - generic [ref=f29e66]:
            - paragraph [ref=f29e67]: AIエージェントには、いくつかの種類があります。以下の表で代表的なものを確認してみましょう。
            - figure [ref=f29e68]:
              - table [ref=f29e69]:
                - rowgroup [ref=f29e73]:
                  - row [ref=f29e74]:
                    - columnheader "種類" [ref=f29e75]
                    - columnheader "概要" [ref=f29e76]
                  - row [ref=f29e77]:
                    - cell "反射エージェント" [ref=f29e78]
                    - cell "事前に定義された条件・ルールや、過去のデータに基づき動作する。" [ref=f29e79]
                  - row [ref=f29e80]:
                    - cell "目標ベースエージェント" [ref=f29e81]
                    - cell "特定の目標達成に焦点を絞って予測・推理を行い、最適な方法を選択して行動する。" [ref=f29e82]
                  - row [ref=f29e83]:
                    - cell "効用ベースエージェント" [ref=f29e84]
                    - cell "複数の選択肢を考慮し、成果の最大化に向けた判断・行動が可能。" [ref=f29e85]
                  - row [ref=f29e86]:
                    - cell "学習エージェント" [ref=f29e87]
                    - cell "経験から学んで自己改善を行い、利用を重ねるほどにパフォーマンスが向上する。" [ref=f29e88]
            - paragraph [ref=f29e89]: AIエージェントは種類ごとに特徴が異なるため、目的に応じて適切に使い分けることが重要です。
      - generic [ref=f29e92]:
        - heading "2．AIエージェントと生成AIの違い" [level=2] [ref=f29e94]
        - article [ref=f29e95]:
          - generic [ref=f29e96]:
            - paragraph [ref=f29e97]: 生成AI（Generative AI）とは、テキスト・画像・動画・音声など多様な形式のコンテンツを新たに生成する人工知能の一種です。たとえば、ChatGPTのようなテキスト生成AIの基盤技術として使われているのがLLMで、会話や文章生成を得意とするため、企業や自治体などでも利活用が始まっています。
            - paragraph [ref=f29e98]: LLMをベースとした生成AIは、「人が質問を投げかけて、AIが回答する」という流れで使用するのが一般的です。一方のAIエージェントは、質問の目的を理解して自律的にタスクを分解し、課題を解決する点が違いだといえます。
            - paragraph [ref=f29e99]: AIエージェントと生成AIの違いを以下の表で見てみましょう。
            - figure [ref=f29e100]:
              - table [ref=f29e101]:
                - rowgroup [ref=f29e106]:
                  - row [ref=f29e107]:
                    - columnheader "種類" [ref=f29e108]
                    - columnheader "AIエージェント" [ref=f29e109]
                    - columnheader "生成AI" [ref=f29e110]
                  - row [ref=f29e111]:
                    - cell "目的" [ref=f29e112]
                    - cell "目標達成に向けたタスク" [ref=f29e113]
                    - cell "コンテンツ生成" [ref=f29e114]
                  - row [ref=f29e115]:
                    - cell "動作原理" [ref=f29e116]
                    - cell "環境からのインプット" [ref=f29e117]
                    - cell "大規模なデータセット" [ref=f29e118]
                  - row [ref=f29e119]:
                    - cell "相互作用性" [ref=f29e120]
                    - cell "環境と双方向にやり取り" [ref=f29e121]
                    - cell "一方向の処理" [ref=f29e122]
                  - row [ref=f29e123]:
                    - cell "活用範囲" [ref=f29e124]
                    - cell "汎用的な能力" [ref=f29e125]
                    - cell "専門的な能力" [ref=f29e126]
            - paragraph [ref=f29e127]: たとえば、「大阪出張の経路」について対話型の生成AIに尋ねると、新幹線や飛行機などを利用した基本的な行き方を案内するでしょう。
            - paragraph [ref=f29e128]: 対するAIエージェントは、同じ質問でもその目的を理解した上で、外部ツールと連携してWeb検索などを実施。新幹線や飛行機の空き状況を確認して予約まで完了してくれる点が大きな違いです。
            - paragraph [ref=f29e129]: AIエージェントは自律的にゴールをめざすことから、LLMよりもさらに一歩進んだ存在だといえます。
            - figure "関連リンク 生成AIとは？メリット・デメリットやLLMをわかりやすく解説" [ref=f29e130]:
              - img "AIエージェントと生成AIの違い" [ref=f29e131]
