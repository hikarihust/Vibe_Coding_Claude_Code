                - text: 関連リンク
                - link "生成AIとは？メリット・デメリットやLLMをわかりやすく解説" [ref=f29e133] [cursor=pointer]:
                  - /url: /business/dx/smart/generative-ai/basic.html
      - generic [ref=f29e136]:
        - heading "3．AIエージェントが求められる背景" [level=2] [ref=f29e138]
        - article [ref=f29e139]:
          - generic [ref=f29e140]:
            - paragraph [ref=f29e141]: 本記事の冒頭でも少し紹介したように、2025年は「AIエージェント元年」と呼ばれています。GoogleやMicrosoft、OpenAIなどの主要テック企業でAIエージェントという言葉が使われはじめ、注目されるようになりました。
            - paragraph [ref=f29e142]: AIエージェントが求められる背景として、LLMを技術基盤とする生成AIの普及が挙げられます。いまや生成AIの技術は飛躍的に進化し、企業でも試しに使ってみる段階から、業務に生成AIを取り組むフェーズへと移行しています。
            - paragraph [ref=f29e143]: しかし、実際に導入したものの「AIが業務の専門性に合っていない」「業務に合わせようとすると、ゼロから設計・開発が必要になりハードルが高い」などの課題が浮き彫りとなっているのが現状です。また、生成AIを効果的に利用するにはノウハウが必要で、「業務での使い方がわからない」「アウトプットの精度が十分でない」と悩む企業も少なくないでしょう。
            - paragraph [ref=f29e144]: そこで、AIが業務目標を理解し、タスクを自律的に分解して課題を解決するAIエージェントが注目されはじめました。AIエージェントの導入によって、生成AIのみでは対応が難しかった業務課題に対しても、複数のタスクを高精度かつ継続的に実行しながら解決を図ることができると期待されています。
      - generic [ref=f29e147]:
        - heading "4．AIエージェントを導入するメリット" [level=2] [ref=f29e149]
        - article [ref=f29e150]:
          - paragraph [ref=f29e152]: ここからは、AIエージェントを導入するメリットについて詳しく解説します。
        - article [ref=f29e153]:
          - heading "①業務の自動化" [level=3] [ref=f29e155]
          - generic [ref=f29e156]:
            - paragraph [ref=f29e157]: AIエージェントの導入によって、人とAIが協働することで業務の自動化につながります。AIエージェントが必要なタスクを判断して優先順位を付け、複数のタスクを継続的に実施して完了するため、大幅な効率化や生産性向上が期待できます。
            - paragraph [ref=f29e158]: 業務・業界に特化したAIエージェントを利用すれば、業務フローに柔軟に組み込めて、現場のニーズに適した業務支援も可能です。
            - paragraph [ref=f29e159]: ただし、完全な自動化によってすべての業務をAIエージェントに任せると、アウトプットの品質面が懸念されます。そこで、基本的なタスクの実行は自動化しつつ、重要な判断や確認は人が実施するフローとすることで、品質を担保し実用性の高い活用ができると考えられます。
        - article [ref=f29e160]:
          - heading "②CX・EXの向上" [level=3] [ref=f29e162]
          - generic [ref=f29e163]:
            - paragraph [ref=f29e164]: AIエージェントの導入で、CXやEXの向上につながると期待できます。CXとは顧客体験、EXは従業員体験のことです。
            - paragraph [ref=f29e165]: たとえば、コールセンターでAIエージェントを活用すると、オペレーターが通話中にリアルタイムでFAQを検索して回答を提案することも可能になります。オペレーターのスキルによらず、均一で一貫性のある対応が実現し、顧客体験が向上するでしょう。
            - paragraph [ref=f29e166]: また、契約業務でAIエージェントを導入するケースでは、著作権法や社内ルールをチェックする業務などを自動化することも可能です。業務効率化だけでなく、従業員は煩雑な業務から解放されてEXが向上すると考えられます。
        - article [ref=f29e167]:
          - heading "③セキュリティ向上" [level=3] [ref=f29e169]
          - generic [ref=f29e170]:
            - paragraph [ref=f29e171]: 社内のIT部門や、IT運用に関するヘルプデスクにAIエージェントを導入することで、IT運用の領域を自動化・効率化できるでしょう。具体的にはネットワーク運用における脆弱性対応や、インシデント検知・対応などが想定されます。
            - paragraph [ref=f29e172]: 従来は人が対応していた作業のサポート・代替ができ、ITセキュリティ担当者の業務負荷を大幅に軽減するとともに、セキュリティ対策の向上も期待できます。
        - article [ref=f29e173]:
          - heading "④意思決定の迅速化" [level=3] [ref=f29e175]
          - generic [ref=f29e176]:
            - paragraph [ref=f29e177]: AIエージェントは、人による意思決定の迅速化を支援します。
            - paragraph [ref=f29e178]: 社内ルールや法律、Web検索などさまざまなデータを横断的に分析し、実行可能なアクションを自律的に提示するため、複雑な課題に対してもスピーディな判断が可能となるでしょう。
      - generic [ref=f29e181]:
        - heading "5．AIエージェントの課題" [level=2] [ref=f29e183]
        - article [ref=f29e184]:
          - paragraph [ref=f29e186]: AIエージェントには複数のメリットがある一方で、いくつかの課題も見られます。
        - article [ref=f29e187]:
          - heading "①情報セキュリティリスク" [level=3] [ref=f29e189]
          - paragraph [ref=f29e191]: AIエージェントを業務フローに組み込む場合、AIエージェントが社内の機密情報にアクセスすることになります。知らず知らずのうちに情報漏洩が起こらないよう、信頼性の高い技術で構築することが重要なポイントです。
        - article [ref=f29e192]:
          - heading "②予測不能な出力・エラー" [level=3] [ref=f29e194]
          - generic [ref=f29e195]:
            - paragraph [ref=f29e196]: AIエージェントに仕事を依頼した場合、予測不能な出力やエラーが発生する可能性も考えられます。
            - paragraph [ref=f29e197]: 判断プロセスがブラックボックス化することもあるため、情報検索やチェックなどの処理はAIに任せ、アウトプットの品質チェックは人が行うなど、AIと人間が協働していくことが大切です。
        - article [ref=f29e198]:
          - heading "③汎用型AIエージェントの限界" [level=3] [ref=f29e200]
          - generic [ref=f29e201]:
            - paragraph [ref=f29e202]: 普遍的な業務をこなす汎用型AIエージェントを利用する場合、自社の業務で活用しきれないケースも想定されます。
            - paragraph [ref=f29e203]: 汎用型AIエージェントは専門的な業務に対応できず、活用するにはゼロから設計・開発が必要になり、コストや労力がかかるなどの課題が残るといえます。そのため、必要に応じて、業界に特化したAIエージェントソリューションの導入を検討する必要があるでしょう。
      - generic [ref=f29e206]:
        - heading "6．NTTドコモビジネスの真に業務で使える 「業界・業務特化型 AIエージェント」" [level=2] [ref=f29e208]: 6．NTTドコモビジネスの真に業務で使える「業界・業務特化型 AIエージェント」
        - article [ref=f29e209]:
          - generic [ref=f29e210]:
            - figure [ref=f29e211]:
              - img "NTTドコモビジネスの業界・特化型エージェント" [ref=f29e212]
            - paragraph [ref=f29e213]: NTTドコモビジネスは、真に業務で使える「業界・業務特化型 AIエージェント」をソリューションとして提供しています。これは、業界・業務に最適化されたAIが、新しいパートナーとしてビジネスをサポートするソリューションです。AI技術の先進性と実用性を兼ね備えており、企業の生産性向上や競争力強化に貢献します。
            - paragraph [ref=f29e214]: 本ソリューションの大きな特長は、業務を理解したAIエージェントに業界知識やルールなどのデータを掛け合わせることで、業務フローに組み込んで活用できる点です。これにより、前述した「AIが業務の専門性と合っていない」「AIを使いこなせない」といった課題解消につながると期待できます。
            - paragraph [ref=f29e215]: また、ベースとなるAIエージェントにカスタマイズを加える仕様のため、開発コストや期間を抑えながら導入できる点もメリットです。自社の業務で使えるAIを比較的低コストかつ短期間で利用できるようになります。
            - paragraph [ref=f29e216]: AIの品質に関する不安は、人が適宜判断を行ったり、アウトプットをチェックする体制を整えることで解消できると考えられます。AIと同僚（ビジネスパートナー）のように協働することで、AIに情報処理などのタスクを任せ、人はアウトプットを判断するといったハイブリッド体制を構築でき、業務効率化や意思決定の迅速化につながるでしょう。
            - paragraph [ref=f29e217]: その他、各社のセキュリティポリシーに合わせた環境で提供が可能なため、安心して業務にご利用いただけます。
            - paragraph [ref=f29e218]:
              - text: 「業界・業務特化型 AIエージェント」は、さまざまな業界のCXやEXだけでなく、CRX
              - superscript [ref=f29e219]: ※3
              - text: ソリューションとしても活用が期待されています。
            - paragraph [ref=f29e220]:
              - text: 真の業務利用が実現する「業界・業務特化型 AIエージェント」について詳細は
              - link "こちら" [ref=f29e221] [cursor=pointer]:
                - /url: /business/dx/smart/generative-ai/ai-agent.html
            - paragraph [ref=f29e222]: ※3 CRX（Cyber Resilience Transformation）…サイバー攻撃に強いIT運用体制に変革すること
        - article [ref=f29e223]:
          - heading "①ユースケース1.製造業界向け知財業務" [level=3] [ref=f29e225]
          - generic [ref=f29e226]:
            - paragraph [ref=f29e227]: 製造業におけるAIエージェントのユースケースとして、知財業務での活用が想定されます。
            - paragraph [ref=f29e228]: 具体的には、特許のアイデア整理から周辺情報の調査、特許申請に必要な書類作成まで一連の業務を複数のAIエージェントと人が協働しながら遂行。企業固有の知財アイデアデータを学習し、外部の特許情報検索サイトを自動でリサーチして、特許出願書類の知識のもと出願書類作成を行う流れの構築が可能です。
            - figure [ref=f29e229]:
              - img "NTTドコモビジネスの製造業界向け知財業務ソリューション" [ref=f29e230]
        - article [ref=f29e231]:
          - heading "②ユースケース2.金融業界向けセールス業務" [level=3] [ref=f29e233]
          - generic [ref=f29e234]:
            - paragraph [ref=f29e235]: 金融業界では、AIエージェントをセールス業務に活用できます。
            - paragraph [ref=f29e236]: たとえば、直近の商談内容や顧客・財務情報、類似案件の情報などを収集・分析し、確度の高い提案方針を策定。方針に基づいた提案書作成までを人と協働しながら遂行します。
