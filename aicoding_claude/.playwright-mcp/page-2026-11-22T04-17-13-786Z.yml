            - generic [ref=f5e236]:
              - heading "ディープラーニングが重要な理由" [level=2] [ref=f5e237]
              - paragraph [ref=f5e238]: ディープラーニングは、無人自動車の実現を支える主要技術であり、一時停止標識の認識や歩行者と街灯の識別を可能にします。電話、タブレット、テレビ、ハンズフリー スピーカーなどの消費者向けデバイスの音声制御にも不可欠な技術です。ディープラーニングは、最近多くの注目を集めていますが、それにはもっともな理由があります。ディープラーニングを使用すると、コンピューターやシステムは複雑なタスクをより高精度かつ高度に自動化して実行できるようになります。
              - heading "ディープラーニングの用途" [level=3] [ref=f5e239]
              - paragraph [ref=f5e240]:
                - text: ディープラーニングは、コンピューター ビジョン、画像処理、自動運転、信号処理、その他の多くの領域で応用されています。ディープラーニングの用途の各領域には、副次的な用途領域が含まれることがあります。たとえば、画像分類、
                - link "オブジェクト検出" [ref=f5e241] [cursor=pointer]:
                  - /url: /discovery/object-detection.html
                - text: 、および
                - link "セマンティック セグメンテーション" [ref=f5e242] [cursor=pointer]:
                  - /url: /help/vision/ug/semantic-segmentation-using-deep-learning.html
                - text: は、コンピューター ビジョンの副次的な用途です。ディープラーニングの手法や技術が新たに開発されるにしたがい、ディープラーニングの用途も拡大を続け、ディープラーニングの精度向上につながる副次的な用途が見いだされます。
