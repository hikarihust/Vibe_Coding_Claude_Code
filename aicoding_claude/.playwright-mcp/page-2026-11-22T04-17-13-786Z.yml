      - generic [ref=f5e39]:
        - heading "ディープラーニング (深層学習) とは" [level=2] [ref=f5e40]
        - heading "スマート エンジニアリング システム設計へのディープラーニング (深層学習) の適用" [level=3] [ref=f5e41]
      - paragraph [ref=f5e55]: ディープラーニング (深層学習) とは、ニューラル ネットワークを使用する機械学習の一分野であり、例から学ぶという人間の自然な行動をコンピューターに学習させるための手法です。ディープラーニングでは、モデルが画像、テキスト、音声などのデータから分類タスクまたは回帰タスクを直接実行するよう学習を行います。ディープラーニング モデルは極めて高い精度を誇り、しばしば人間の認識精度を超えることがあります。
      - generic [ref=f5e56]:
        - generic [ref=f5e68]:
          - generic [ref=f5e72]:
            - generic [ref=f5e74]:
              - heading "ディープラーニングの仕組み" [level=2] [ref=f5e75]
              - paragraph [ref=f5e76]:
                - text: ディープラーニング モデルは、
                - link "ニューラル ネットワーク" [ref=f5e77] [cursor=pointer]:
                  - /url: /discovery/neural-network.html
                - text: アーキテクチャに基づいています。人間の脳にヒントを得たニューラル ネットワークは、層構造内で相互接続されたノード、すなわちニューロンで構成されており、これらのニューロンが入力を望ましい出力に関連付けます。ニューラル ネットワークの入力層と出力層の間のニューロンは、隠れ層と呼ばれています。「ディープ」という言葉は通常、ニューラル ネットワーク内の隠れ層の数を指しています。ディープラーニング モデルは、数百または数千にもなる隠れ層を持つ場合があります。
            - figure "一般的なニューラル ネットワーク アーキテクチャの表示。" [ref=f5e80]:
              - img "ディープラーニング ネットワークは、相互接続された一連のニューロンからなる複数の層で構成されています。" [ref=f5e81]
              - paragraph [ref=f5e83]: 一般的なニューラル ネットワーク アーキテクチャの表示。
            - generic [ref=f5e85]:
              - paragraph [ref=f5e86]: ディープラーニング モデルでは、大規模な一連のラベルデータを使用して学習が行われ、手動での特徴抽出を必要とせずにデータから特徴量を直接学習できる場合が多くあります。1958 年に初めて理論化された人工ニューラル ネットワークですが、ディープラーニングには高い計算能力が求められ、2000 年代まで利用することができませんでした。現在では、研究者は数百もの結合やニューロンを持つネットワークの構築および学習を行える計算リソースを利用できます。
              - paragraph [ref=f5e87]: 高性能 GPU は、ディープラーニングの計算を効率化する並列アーキテクチャを有しています。クラスターまたはクラウド コンピューティングと組み合わせると、開発チームは、ディープラーニング ネットワークの学習時間を数週間から数時間以内に削減できるようになります。
            - figure [ref=f5e94]:
              - generic [ref=f5e96]:
                - 'link "エンジニアのための AI: AI システムの構築  ビデオの長さ 3:40" [ref=f5e97] [cursor=pointer]':
                  - /url: /videos/ai-for-engineers-building-an-ai-system-1603356830725.html
