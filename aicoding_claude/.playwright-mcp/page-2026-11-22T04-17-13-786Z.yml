            - generic [ref=f5e110]:
              - heading "ディープラーニング モデルの種類" [level=3] [ref=f5e111]
              - paragraph [ref=f5e112]:
                - text: ディープラーニング モデルには、
                - link "畳み込みニューラル ネットワーク" [ref=f5e113] [cursor=pointer]:
                  - /url: /discovery/convolutional-neural-network.html
                - text: (CNN)、
                - link "リカレント ニューラル ネットワーク" [ref=f5e114] [cursor=pointer]:
                  - /url: /discovery/rnn.html
                - text: (RNN)、および
                - link "トランスフォーマー モデル" [ref=f5e115] [cursor=pointer]:
                  - /url: /matlabcentral/fileexchange/107375-transformer-models
                - text: の 3 種類があります。
              - paragraph [ref=f5e116]:
                - text: "CNN: CNN では入力データを使用して学習済みの特徴を畳み込み、2D の畳み込み層を使用するため、画像などの 2D データの処理に特に適したアーキテクチャです。CNN では、画像から直接特徴量を抽出します。ネットワークが一連の画像で学習を行う間に関連する特徴量が学習されます。この自動化された"
                - link "特徴抽出" [ref=f5e117] [cursor=pointer]:
                  - /url: /discovery/feature-extraction.html
                - text: により、画像分類タスクにおいてディープラーニング モデルは高い精度を実現しています。また、CNN は、時系列やテキストなど他のタイプのデータの分類に使用することもできます。
            - figure "畳み込みニューラル ネットワークの例の可視化。" [ref=f5e120]:
              - img "畳み込みニューラル ネットワークによるディープラーニングでは、特徴量を入力画像から自動的に学習し、クラスごとに確率を計算します。" [ref=f5e121]
              - paragraph [ref=f5e123]: 畳み込みニューラル ネットワークの例の可視化。
            - generic [ref=f5e125]:
              - paragraph [ref=f5e126]:
                - text: "RNN: リカレントニューラルネットワーク (RNN) は、時系列データまたはシーケンシャルデータを用いた予測を行うディープラーニングのネットワーク アーキテクチャです。RNN は、さまざまな長さのシーケンシャルデータを使用して、自然信号の分類、言語処理、動画解析などの問題を解く場合に特に効果的です。"
                - link "長・短期記憶" [ref=f5e127] [cursor=pointer]:
                  - /url: /discovery/lstm.html
                - text: (LSTM) ネットワークは特別なタイプの RNN で、より長期的な依存関係の学習において単純な RNN よりも優れています。
              - paragraph [ref=f5e128]:
                - text: "トランスフォーマー: トランスフォーマーは、シーケンシャルデータの関係を追跡するよう設計されています。トランスフォーマーは、入力と出力の間の大域的な依存関係を取得するために自己注意機構を使用します。"
                - link "自然言語処理" [ref=f5e129] [cursor=pointer]:
                  - /url: /discovery/natural-language-processing.html
                - text: で使用されることが多く、BERT や ChatGPT™ などの大規模言語モデル (LLM) の基礎となっています。
            - generic [ref=f5e133]:
              - heading "このトピックについてさらに詳しく" [level=4] [ref=f5e136]
              - link " ディープ ネットワーク デザイナーを使用したシンプルなシーケンス分類ネットワークの作成" [ref=f5e138] [cursor=pointer]:
                - /url: /help/deeplearning/getting-started-with-deep-learning-toolbox.html
              - link " BERT による文書分類器の学習" [ref=f5e140] [cursor=pointer]:
                - /url: /help/textanalytics/ug/train-bert-document-classifier.html
            - generic [ref=f5e142]:
              - heading "ディープラーニング モデルの作成方法" [level=3] [ref=f5e143]
              - paragraph [ref=f5e144]:
                - text: ディープラーニング モデルはゼロから作成するか、または
                - link "事前学習済みのディープラーニング モデル" [ref=f5e145] [cursor=pointer]:
                  - /url: /products/deep-learning/models.html
                - text: を使用して始めることで、タスクに適用または導入できます。
              - paragraph [ref=f5e146]:
                - text: "ゼロからの学習: ディープラーニング モデルの学習をゼロから行うには、大規模なラベルデータセットを収集し、特徴量とモデルを学習するネットワーク アーキテクチャを設計します。これは、新しい用途や特定の用途、もしくはより一般的に、既存のモデルが存在しない用途に適したアプローチです。このアプローチの主なデメリットは、("
                - link "グラウンド トゥルース" [ref=f5e147] [cursor=pointer]:
                  - /url: /discovery/ground-truth.html
                - text: のアノテーション付きの) 大規模なデータセットが必要となることや、タスクと計算リソースによっては学習に数時間から数週間かかる場合があることです。
              - paragraph [ref=f5e148]:
                - text: "転移学習: 画像分類、コンピューター ビジョン、音声処理、自然言語処理などのディープラーニングの用途では、"
                - link "転移学習" [ref=f5e149] [cursor=pointer]:
                  - /url: /discovery/transfer-learning.html
                - text: のアプローチが広く使用されています。このアプローチでは、事前学習済みのディープラーニング モデルを微調整します。画像分類では SqueezeNet や GoogLeNet などの既存のモデルで始めて、未知のクラスを含む新しいデータを与えて学習させます。ネットワークに微調整を加えた後は、「1000 種類のオブジェクトの分類」ではなく「犬か猫かの分類」といった新しいタスクを行えるようになります。また、少ないデータ量で済むというメリットもあるため、学習時間を大幅に削減できます。
              - paragraph [ref=f5e150]:
                - text: 事前学習済みのディープラーニング モデルは、特徴抽出器としても使用できます。層の活性化状態を特徴として使用し、別の機械学習モデル (
                - link "サポート ベクター マシン (SVM)" [ref=f5e151] [cursor=pointer]:
                  - /url: /discovery/support-vector-machine.html
                - text: など) の学習を行うことができます。または、事前学習済みのモデルを、別のディープラーニング モデルの基本構成として使用することも可能です。たとえば、画像分類の CNN をオブジェクト検出器の特徴抽出器として使用できます。
            - generic [ref=f5e155]:
              - heading "このトピックについてさらに詳しく" [level=4] [ref=f5e158]
              - 'link " MATLAB によるディープラーニング: 10 行のコードで転移学習 (4:41)" [ref=f5e160] [cursor=pointer]':
                - /url: /videos/deep-learning-with-matlab-transfer-learning-in-10-lines-of-matlab-code-1487714838381.html
              - link " Deep Learning Toolbox、TensorFlow、PyTorch、ONNX 間の相互運用性" [ref=f5e162] [cursor=pointer]:
                - /url: /help/deeplearning/ug/interoperability-between-deep-learning-toolbox-tensorflow-pytorch-and-onnx.html
          - generic [ref=f5e166]:
            - generic [ref=f5e168]:
              - heading "ディープラーニングと機械学習の比較" [level=2] [ref=f5e169]
              - paragraph [ref=f5e170]:
                - text: ディープラーニングは
                - link "機械学習" [ref=f5e171] [cursor=pointer]:
                  - /url: /discovery/machine-learning.html
                - text: の特殊な一形態であり、両者はいずれも
                - link "人工知能 (AI)" [ref=f5e172] [cursor=pointer]:
                  - /url: /discovery/artificial-intelligence.html
                - text: 分野の一部です。機械学習では
                - link "さまざまな手法やモデル" [ref=f5e173] [cursor=pointer]:
                  - /url: /discovery/machine-learning-models.html
                - text: が提供されており、アプリケーション、処理するデータのサイズ、解決したい問題のタイプに応じて選択できます。
            - figure "AI アプリケーションのアルゴリズムとして、ディープラーニングと機械学習のどちらを選択するかは、システムの目標と要件によって異なります。" [ref=f5e176]:
              - img "AI、機械学習、およびディープラーニングの 3 つすべてを示したイラストによる定義。" [ref=f5e177]
              - paragraph [ref=f5e179]: AI アプリケーションのアルゴリズムとして、ディープラーニングと機械学習のどちらを選択するかは、システムの目標と要件によって異なります。
            - paragraph [ref=f5e182]: 機械学習ではなくディープラーニングを選択する理由はなんでしょうか? 一言で言えば、精度です。一般的にディープラーニングでは、機械学習よりも高い精度が得られ、拡張ワークフローをより自動化できます。ディープラーニング モデルの主な短所は、より複雑であり、大規模な学習データセットが必要なことから、学習により長い時間がかかることです。これらの短所については、完全に対処する手法や影響を軽減する手法があります。
            - generic [ref=f5e184]:
              - heading "特徴量エンジニアリングの自動化" [level=3] [ref=f5e185]
              - paragraph [ref=f5e186]:
                - text: 機械学習のワークフローは、データから関連する特徴量を手動で抽出することから始まります。次に、その特徴量を使用して、新しいデータに対して予測を行えるモデルを作成します。ディープラーニングのワークフローを使用すると、
                - link "画像認識" [ref=f5e187] [cursor=pointer]:
                  - /url: /discovery/image-recognition.html
                - text: や
                - link "コンピューター ビジョン" [ref=f5e188] [cursor=pointer]:
                  - /url: /discovery/computer-vision.html
                - text: などの用途では、関連する特徴量が画像データから自動的に抽出されます。信号またはテキストデータを扱う場合、ディープラーニングにより必要な
                - link "データ前処理" [ref=f5e189] [cursor=pointer]:
                  - /url: /discovery/data-preprocessing.html
                - text: を減らすことができます。
            - figure "車両の分類における機械学習手法 (左) とディープラーニング(右) の比較。" [ref=f5e192]:
              - img "機械学習と比較した場合、ディープラーニングでは画像分類タスクにおいて手動で特徴抽出を行う必要がありません。"
              - paragraph [ref=f5e194]: 車両の分類における機械学習手法 (左) とディープラーニング(右) の比較。
            - generic [ref=f5e196]:
              - heading "学習データと学習時間" [level=3] [ref=f5e197]
              - paragraph [ref=f5e198]:
                - text: ディープラーニングの精度は、データ量に比例します。つまり、ディープラーニングのパフォーマンスは、学習データのサイズが大きくなるにつれ改善されていきます。一般的にディープラーニングでは、モデルの学習を行うために極めて膨大なデータが必要となります (画像分類に何千もの画像が必要になるなど)。高性能の
                - link "GPU" [ref=f5e199] [cursor=pointer]:
                  - /url: /solutions/gpu-computing.html
                - text: を利用することで、学習時間を大幅に削減できます。また代案として、転移学習により事前学習済みのネットワークを変更して再学習を行うと、一般により高速化でき、ネットワークの学習をゼロから行うよりも少ないラベルデータで済ませることができます。
              - paragraph [ref=f5e200]:
                - text: 利用できる学習データが十分にない場合は、既存のデータを合成データで補完できます。合成データは、
                - link "敵対的生成ネットワーク (GAN)" [ref=f5e201] [cursor=pointer]:
                  - /url: /discovery/generative-adversarial-networks.html
                - text: を使用するか、または物理システムのモデルを作成およびシミュレーションすることで生成できます。
              - heading "モデルのサイズと複雑度" [level=3] [ref=f5e202]
              - paragraph [ref=f5e203]: 機械学習モデルと比較すると、ディープラーニング モデルは何百もの相互接続された層で構築されているため、より複雑で大規模なものとなります。ディープラーニングの技術が進歩するにつれ、ディープラーニング ネットワーク アーキテクチャは複雑度を増していきます。モデルの複雑度とサイズは、ディープラーニングの精度に寄与します。
              - paragraph [ref=f5e204]:
                - text: その複雑さのために、ディープラーニング モデルは
                - link "解釈可能性" [ref=f5e205] [cursor=pointer]:
                  - /url: /discovery/interpretability.html
                - text: を欠く「ブラックボックス」と見なされることがよくあります。
                - link "説明可能な AI" [ref=f5e206] [cursor=pointer]:
                  - /url: https://blogs.mathworks.com/deep-learning/2022/12/30/what-is-explainable-ai/
                - text: として知られる新しい分野では、ディープラーニング モデルの動作を人間の言葉で説明する手法を提供しています。たとえば、
                - link "Grad-CAM" [ref=f5e207] [cursor=pointer]:
                  - /url: /help/deeplearning/ref/gradcam.html
                - text: および
                - link "LIME" [ref=f5e208] [cursor=pointer]:
                  - /url: /help/deeplearning/ref/imagelime.html
                - text: を使用して、画像分類タスクにおけるディープラーニング モデルの予測を説明することができます。
              - paragraph [ref=f5e209]: ディープラーニング モデルは、もはやデスクトップにのみ存在するものではありません。大規模化と複雑化が進むディープラーニング モデルをリソースに制約のあるデバイスに展開することは、多くのディープラーニング実務者が直面する大きな課題となっています。ディープラーニング モデルを圧縮する手法は数多くあり、それらを使用することで、高い精度を維持しながら、ディープラーニング モデルのディスク上のサイズ、ランタイムメモリ、および推論時間を削減できます。
            - figure "全結合層の射影。射影はネットワーク圧縮の一手法。" [ref=f5e216]:
              - img "射影の使用による全結合層の圧縮。層の演算は図の下に記述。" [ref=f5e217]
              - paragraph [ref=f5e219]: 全結合層の射影。射影はネットワーク圧縮の一手法。
