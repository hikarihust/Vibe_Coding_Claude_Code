                  - generic [ref=f5e100]:
                    - text: 
                    - generic [aria-hidden] [ref=f5e101]: 3:40
                    - generic [ref=f5e102]: ビデオの長さ 3:40
                - 'figure "エンジニアのための AI: AI システムの構築" [ref=f5e103]':
                  - paragraph [ref=f5e105]:
