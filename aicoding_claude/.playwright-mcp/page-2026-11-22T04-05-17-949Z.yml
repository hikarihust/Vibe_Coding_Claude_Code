        - heading "AIエージェントとは？" [level=2] [ref=f5e207]
        - article [ref=f5e209]:
          - generic [ref=f5e210]:
            - paragraph [ref=f5e211]:
              - strong [ref=f5e212]: AIエージェント
              - text: は、アプリやクラウドといったデジタル環境、そしてロボットやセンサー機器といった物理的な環境で、AIの手法を使って状況を把握し、判断し、行動し、目標を達成できる自律（または半自律）のソフトウェアです。つまり、人の細かな指示がなくても、最小限の監督で、必要に応じてさまざまなタスクや環境に適応して動作できます。
            - paragraph [ref=f5e213]: AIエージェント導入の共通のねらいには、業務効率化／顧客対応の向上／複雑作業の自動化が挙げられます。
            - list [ref=f5e214]:
              - listitem [ref=f5e215]:
                - strong [ref=f5e216]: 汎用的な活用例
                - list [ref=f5e217]:
                  - listitem [ref=f5e218]:
                    - strong [ref=f5e219]: 旅行予約：
                    - text: 希望条件に合わせて旅程作成・予約を自動化
                  - listitem [ref=f5e220]:
                    - strong [ref=f5e221]: 保険：
                    - text: 引受審査の支援、保険金請求の自動処理、問い合わせ対応
                  - listitem [ref=f5e222]:
                    - strong [ref=f5e223]: 社内ヘルプデスク：
                    - text: チケット起票から管理までを自動化し、担当者の負荷を軽減
                  - listitem [ref=f5e224]:
                    - strong [ref=f5e225]: 医療受付：
                    - text: 診療予約や処方箋リフィルを自動化し、手続きを簡素化
            - list [ref=f5e226]:
              - listitem [ref=f5e227]:
                - strong [ref=f5e228]: 業界別活用例
                - list [ref=f5e229]:
                  - listitem [ref=f5e230]:
                    - strong [ref=f5e231]: 金融：
                    - text: 不正調査（口座データの整理・要約）、コールセンターの応対強化
                  - listitem [ref=f5e232]:
                    - strong [ref=f5e233]: 通信：
                    - text: ネットワークの自動監視・異常検知で障害を未然に対応
                  - listitem [ref=f5e234]:
                    - strong [ref=f5e235]: 小売：
                    - text: レコメンドや自動応答で顧客体験を改善
                  - listitem [ref=f5e236]:
                    - strong [ref=f5e237]: 人事：
                    - text: 採用プロセスの効率化、従業員のセルフサービス（給与・福利厚生照会）
              - listitem [ref=f5e238]:
                - strong [ref=f5e239]: 新たに伸びる分野
                - list [ref=f5e240]:
                  - listitem [ref=f5e241]:
                    - strong [ref=f5e242]: ダイナミック・ケース管理：
                    - text: 物流・サプライチェーンなど、状況に応じてリアルタイムで手順を切り替える業務の自動化
                  - listitem [ref=f5e243]:
                    - strong [ref=f5e244]: 営業・マーケ自動化：
                    - text: 顧客データ分析で商談機会を特定し、キャンペーン運用を自動化
        - button "「生成AIとAIエージェントトレンド」のWebinarをアーカイブ視聴したい方はこちら " [ref=f5e248] [cursor=pointer]:
          - text: 「生成AIとAIエージェントトレンド」のWebinarをアーカイブ視聴したい方はこちら
          - generic [ref=f5e249]: 
        - heading "AIエージェントの主な特徴" [level=2] [ref=f5e253]
        - article [ref=f5e255]:
          - paragraph [ref=f5e257]:
            - text: AIエージェントは、複雑な業務の自動化と全社的な運用効率の向上を実現する手段になります。
            - strong [ref=f5e258]: 学習／適応／自律性
            - text: によって従来の自動化よりも、顕著な事業価値の創出を可能にします。技術の進化が加速する現在、これらの特徴の理解は、効果的な導入の前提条件となります。以下に主な特徴を説明します。
        - heading "学習" [level=3] [ref=f5e262]
        - article [ref=f5e264]:
          - list [ref=f5e266]:
            - listitem [ref=f5e267]: 使うたびに結果を記録し、次に同じような場面でより良い方法を選べるようになる
            - listitem [ref=f5e268]: 文章／音声／画像など、いろいろな情報から学べるので理解の幅が広い
            - listitem [ref=f5e269]: 学んだ内容をもとに、目標を小さな作業に分けたり、優先順位をつけたりする精度が上がる
        - heading "適応性" [level=3] [ref=f5e273]
        - article [ref=f5e275]:
          - list [ref=f5e277]:
            - listitem [ref=f5e278]: 新しい情報が入ったら、その場で計画や手順を見直してやり方を変える
            - listitem [ref=f5e279]: 「誰のために／いつ／どこで／制約は何か」といった状況を読み取り、最適な方法に切り替える
            - listitem [ref=f5e280]: 予測しにくい場面でも、方針（安全重視、効率重視など）に沿って処理を選び直す
            - listitem [ref=f5e281]: 複数のエージェントがいる場合は、役割分担や引き継ぎを状況に合わせて調整する
        - heading "自律性" [level=3] [ref=f5e285]
        - article [ref=f5e287]:
          - list [ref=f5e289]:
            - listitem [ref=f5e290]: 人が細かい指示を出さなくても、決められた目標に向けて自分で動ける
            - listitem [ref=f5e291]: 「目標設定 → 作業に分解 → 進み具合の確認 → やり方の調整」を自分で回す
            - listitem [ref=f5e292]: 変化が起きても、リアルタイムに判断して行動できる
        - heading "生成AIとの違いとは？" [level=2] [ref=f5e296]
        - article [ref=f5e298]:
          - generic [ref=f5e299]:
            - list [ref=f5e300]:
              - listitem [ref=f5e301]:
                - strong [ref=f5e302]: AIエージェント（自律性）
                - text: ：目標を与えると、自分で状況を見て考え、手順を決め、必要なツールやシステムを使って主体的に動く仕組み。途中で環境が変われば作戦も変える
              - listitem [ref=f5e303]:
                - strong [ref=f5e304]: 生成AI（指示応答）
                - text: ：こちらが指示や質問をすると、その場で答えや文章・画像を生成して返す仕組み。基本は呼ばれたら返す“受け身”なリアクション
            - paragraph [ref=f5e305]:
              - strong [ref=f5e306]: AIエージェント例：
              - text: ‘今週の問い合わせを自動で仕分けして、急ぎは人に回す’を伝えると、状況を見ながら段取りを決め、必要があれば他の担当（他エージェント）とも連携して進める
            - paragraph [ref=f5e307]:
              - strong [ref=f5e308]: 生成AIの例：
              - text: こちらがうまく聞けば、分かりやすい回答や文章をすぐ出してくれる。ただし、動くのは人。次に何をするか、どこに登録するかは指示しないと進まない
