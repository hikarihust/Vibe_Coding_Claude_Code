          - paragraph [ref=f5e792]: フォームにご記入いただくと、無料でダウンロードできます。
        - heading "AIエージェントを活用する際のリスクとは？" [level=2] [ref=f5e797]
        - article [ref=f5e799]:
          - generic [ref=f5e800]:
            - paragraph [ref=f5e801]: AIエージェントには多くの利点がある一方で、自律性や学習能力、複雑なタスク実行能力の高さゆえに、さまざまなリスクが存在します。リスクを適切に管理しないと、企業に重大な損失や法的問題をもたらす可能性があります。
            - paragraph [ref=f5e802]: 主なリスクを以下に整理します。
        - heading "セキュリティ上のリスク" [level=3] [ref=f5e806]
        - article [ref=f5e808]:
          - list [ref=f5e810]:
            - listitem [ref=f5e811]:
              - strong [ref=f5e812]: データ漏洩とプライバシー侵害
              - text: ：AIエージェントが機密情報にアクセスするケースが多いことから、データ漏洩のリスクが高まります。
            - listitem [ref=f5e813]:
              - strong [ref=f5e814]: 敵対的攻撃
              - text: ：外部から送信される不正ペイロードや攻撃コードなどによる攻撃リスクが考えられます。
            - listitem [ref=f5e815]:
              - strong [ref=f5e816]: 不正利用
              - text: ：エージェントが犯罪者に乗っ取られたり悪用されたりすると、深刻な不正行為につながる可能性があります。
        - heading "意思決定と法的責任に関するリスク" [level=3] [ref=f5e820]
        - article [ref=f5e822]:
          - list [ref=f5e824]:
            - listitem [ref=f5e825]:
              - strong [ref=f5e826]: 不正確な出力やハルシネーション（幻覚）
              - text: ：AIエージェントが誤った回答を生成し、それに基づいて企業が誤った判断を下すリスクがあります。
            - listitem [ref=f5e827]:
              - strong [ref=f5e828]: 知的財産権の侵害
              - text: ：知らないうちに他者の知的財産を外部へ配信する可能性があり、法的責任の問題が発生します。
            - listitem [ref=f5e829]:
              - strong [ref=f5e830]: 法令遵守違反
              - text: ：AIエージェントが法規制に反する行為を行うリスクや、顔認識ソフトウェアの誤判定による人権侵害などが挙げられます。
            - listitem [ref=f5e831]:
              - strong [ref=f5e832]: 責任所在の不明確化
              - text: ：エージェントが自律的に意思決定を行うため、最終的な責任の所在が不透明になる恐れがあります。
        - heading "信頼性に関するリスク" [level=3] [ref=f5e836]
        - article [ref=f5e838]:
          - list [ref=f5e840]:
            - listitem [ref=f5e841]:
              - strong [ref=f5e842]: ブラックボックス化
              - text: ：外部提供のエージェントやモデルは内部構造が不透明で、プライバシー評価や法規制適合性の確認が困難です。
            - listitem [ref=f5e843]:
              - strong [ref=f5e844]: 不適切な意思決定
              - text: ：AIの誤作動や誤学習によって、ビジネスにとって好ましくない意思決定が行われる可能性があります。
            - listitem [ref=f5e845]:
              - strong [ref=f5e846]: 予期せぬ行動
              - text: ：自律性の高さゆえに、想定外の出力やエラーが発生する場合があります。
            - listitem [ref=f5e847]:
              - strong [ref=f5e848]: マルチエージェント・システムの複雑性
              - text: ：複数のエージェント間で目的や相互作用が衝突すると、予期せぬ問題や不適切な振る舞いが生じることがあります。
        - heading "技術的／実務面での課題" [level=3] [ref=f5e852]
        - article [ref=f5e854]:
          - generic [ref=f5e855]:
            - paragraph [ref=f5e856]: AIエージェについては、さまざま活用例がありますが、実用化には次のような障壁があります。
            - paragraph [ref=f5e857]:
              - strong [ref=f5e858]: AIエージェントの技術上の課題
            - list [ref=f5e859]:
              - listitem [ref=f5e860]:
                - strong [ref=f5e861]: 技術の未成熟
                - text: 現実の環境を正しく理解し、臨機応変に最適な行動をとる力がまだ十分ではありません。そのため、実務の現場では動作が不安定になりがちです。
              - listitem [ref=f5e862]:
                - strong [ref=f5e863]: 脆弱性（セキュリティの弱さ）
                - text: アクセス権限やデータの守りが甘いと、情報漏えいなどのリスクが高まります。適切な設計・運用が不可欠です。
              - listitem [ref=f5e864]:
                - strong [ref=f5e865]: 信頼性の不足
                - text: 予想外の動きをしたり、なぜその判断をしたのか説明しにくかったりするため、利用者が不安になりやすいという問題があります。
              - listitem [ref=f5e866]:
                - strong [ref=f5e867]: 解釈性と監督の難しさ
                - text: 「どういうルールで判断しているのか」が見えにくく、途中経過を追いにくいことがあります。そのため、きちんと監視し、制御する仕組みが必要です。
              - listitem [ref=f5e868]:
                - strong [ref=f5e869]: 変化の速さ
                - text: 技術進歩が速すぎて、導入後すぐ古くなる懸念があります。最新版への追随や更新計画が求められます。
            - paragraph [ref=f5e870]:
              - strong [ref=f5e871]: AIエージェントの実務（運用）上の課題
              - text: 上記の技術的な障壁に加え、AIエージェントには実装と有効性に影響するいくつかの実務上の課題があります。
            - list [ref=f5e872]:
              - listitem [ref=f5e873]:
                - strong [ref=f5e874]: レガシーシステムとの統合
                - text: 古い業務システムと相性が悪く、連携に手間や追加コストがかかることがあります。
              - listitem [ref=f5e875]:
                - strong [ref=f5e876]: データの質と使いやすさ
                - text: AIはデータ次第です。欠落やバラつきが多い、取り出しにくい、といった状態だと性能が出ません。データ整備がカギとなります
              - listitem [ref=f5e877]:
                - strong [ref=f5e878]: チェンジマネジメント（働き方の変更）
                - text: 既存の業務手順を見直す必要があり、慣れたやり方を変えることへの抵抗が起きやすいです。段階的な導入と説明が重要です。
              - listitem [ref=f5e879]:
                - strong [ref=f5e880]: AIリテラシーの不足
                - text: 社内でAIの基本理解が足りないと、せっかくの機能を活かしきれません。研修やガイドの整備が必要です。
              - listitem [ref=f5e881]:
                - strong [ref=f5e882]: IT部門と事業部門の連携不足
                - text: AIエージェントの導入の成功には、IT部門と事業部門両方の協力が不可欠です。部門の縦割りが強いと、現場への組み込みが進まず効果が出にくくなります。
            - paragraph [ref=f5e883]: AIエージェントの導入を成功させるには、技術面（性能・安全性・更新性）と実務面（データ整備、運用設計、人／組織の受け入れ）の両方を計画的に進めることが大切です。安全に効果を引き出すために、段階導入、明確な責任分担、教育・ガバナンス整備などを検討することが重要です。
        - heading "AIのリスク管理手法「AI TRiSM」とは？" [level=2] [ref=f5e887]
        - article [ref=f5e889]:
          - generic [ref=f5e890]:
            - paragraph [ref=f5e891]:
              - text: ガートナーでは、AIリスクを管理するための枠組みとして、
              - link [ref=f5e892] [cursor=pointer]:
                - /url: /ja/articles/ai-governance-trism
                - strong [ref=f5e893]: AI TRiSM （AIのトラスト／リスク／セキュリティ・マネジメント）
              - text: を提唱しています。
            - paragraph [ref=f5e894]: AI TRiSMは、AIの信頼性・リスク・セキュリティを一体的に管理するためのフレームワークおよび技術的能力の総称です。ポリシーを定めるだけでは管理しきれない、稼働中のAIに生じる動的なリスクを、継続的なモニタリング・検証・実効化によってコントロールすることを目的としています。
            - paragraph [ref=f5e895]: なぜ重要か
            - paragraph [ref=f5e896]: AIの活用が広がるほど、データ侵害（漏えい・改ざん）、外部委託やサードパーティ利用のリスク、誤回答や望ましくない出力（ハルシネーション等）といった新しい信頼／リスク／セキュリティ課題が増えます。
            - paragraph [ref=f5e897]: AI TRiSMは、「AIのふるまいが企業の意図と一致しているか」を常に確認、是正し、社内外の信頼を高め、導入リスクを抑えます。
            - paragraph [ref=f5e898]: AIエージェントは自律的に判断し行動するため、導入時の一度きりの審査では監督が追いつきません。前節で挙げたリスクに実効的に対処するには、稼働と並走する継続的なガバナンスが前提になります。
            - paragraph [ref=f5e899]: AI TRiSMの構成要素、経済産業省・総務省「AI事業者ガイドライン」との対応関係、企業が取るべき具体的なステップについては、次の記事で詳しく解説しています。
        - button "AIガバナンスとは？国内ガイドラインや実装ステップとAI TRiSMによる実効化を解説 " [ref=f5e903] [cursor=pointer]:
          - text: AIガバナンスとは？国内ガイドラインや実装ステップとAI TRiSMによる実効化を解説
          - generic [ref=f5e904]: 
        - heading "AIエージェント導入のさまざまな課題におけるガートナーのインサイト" [level=2] [ref=f5e908]
        - article [ref=f5e910]:
          - generic [ref=f5e911]:
            - paragraph [ref=f5e912]: ガートナーは、企業や組織がAIエージェントを導入／活用する際に直面する課題やリスクを総合的に分析し、その解決策を提示しています。ガートナーのリサーチノートでは、AIエージェントがもたらす最新動向や可能性だけでなく、リスク軽減のための対策やガバナンス・モデルなども詳しく解説されています。たとえば、以下のようなリサーチノートを通じて、AIエージェントに関するより深いインサイトを得ることができます。
            - paragraph [ref=f5e913]: ※ご契約者様向けのリソースです。ご契約のお客様は、以下のリサーチノートからさらなる詳細をご確認いただけます。
            - paragraph [ref=f5e914]:
              - strong [ref=f5e915]:
                - link "AIエージェントのリアリティ" [ref=f5e916] [cursor=pointer]:
                  - /url: https://www.gartner.com/document-reader/document/6021935
              - text: 執筆：
              - link "亦賀 忠明" [ref=f5e917] [cursor=pointer]:
                - /url: /ja/research/expert-bio/tadaaki_mataga
              - text: ","
              - link "針生 恵理" [ref=f5e918] [cursor=pointer]:
                - /url: /ja/research/expert-bio/eri_hariu
              - text: AIエージェントが急速にバズワードになりつつあります。AIエージェントは、人の力を介さずにタスクを自律的に実行できる仕組みであり、これに対する業界やユーザーの期待が高まっています。AIを推進するテクノロジ・イノベーションのリーダーは、今できることと将来できることを明確に区別し、リアリティに基づいて採用方針を決定すべきです。
            - paragraph [ref=f5e919]:
              - strong [ref=f5e920]:
                - link "クイック・アンサー：AIエージェントとエージェント型AIをどう捉え、何をすべきか" [ref=f5e921] [cursor=pointer]:
                  - /url: https://www.gartner.com/en/documents/6381843
              - text: 執筆：
              - link "亦賀 忠明" [ref=f5e922] [cursor=pointer]:
                - /url: /ja/research/expert-bio/tadaaki_mataga
              - text: AIエージェントは、急速に進化しつつある革新的な領域です。一方、市場には現在「AIエージェント」と「エージェント型AI (Agentic AI：エージェンティックAI)」という2つの用語が存在しており、混乱が生じている。これらを明確に区分することは、AIの戦略や適用タイミングを判断する上で重要です。
            - paragraph [ref=f5e923]:
              - strong [ref=f5e924]:
                - link "イノベーション・インサイト：AIエージェント" [ref=f5e925] [cursor=pointer]:
                  - /url: https://www.gartner.com/en/documents/5688219
              - text: 監訳：
              - link "林 宏典" [ref=f5e926] [cursor=pointer]:
                - /url: /ja/research/expert-bio/hironori_hayashi
              - text: 企業は、業種を問わず複雑な作業を自律的に実行する画期的なテクノロジとして、AIエージェントの進化を注視すべきです。AIエージェントは、業務を革新的に変える機会を提供する一方で、セキュリティや倫理上の重大な懸念も生み出すからです。
            - paragraph [ref=f5e927]:
              - strong [ref=f5e928]:
                - link "クイック・アンサー：AIエージェントがもたらす新たなリスクとセキュリティ脅威を低減する" [ref=f5e929] [cursor=pointer]:
                  - /url: https://www.gartner.com/document-reader/document/5966639
              - text: 監訳：
              - link "礒田 優一" [ref=f5e930] [cursor=pointer]:
                - /url: /ja/research/expert-bio/yuichi_isoda
              - text: OpenAIやMicrosoftなどの先進のモデル・プロバイダーが既にAIエージェントを推進していますが、これらはAIモデルやAIアプリケーションに内在するリスクの範囲を超えた新たなリスクやセキュリティ脅威をもたらします。本リサーチノートでは、こうした新たなリスクを説明するとともに、リスク低減のために実装すべき新たなコントロールについて分析します。
