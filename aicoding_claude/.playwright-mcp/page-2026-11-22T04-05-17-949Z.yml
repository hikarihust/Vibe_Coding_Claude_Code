        - heading "エージェント型AI (Agentic AI、エージェンティックAI) との違いとは？" [level=2] [ref=f5e407]
        - article [ref=f5e409]:
          - generic [ref=f5e410]:
            - paragraph [ref=f5e411]:
              - strong [ref=f5e412]: エージェント型AIは、組織のために⾏動し、⾃律的に意思決定を下してアクションを起こすために、組織に代わって⾏動する権利を付与された、⽬標主導型のソフトウェ ア‧エンティティです。
            - paragraph [ref=f5e413]: 記憶、計画、センシング、ツール利⽤、ガードレールなどのコンポーネントと共にAI⼿法を使⽤して、タスクを完了し、⽬標を達成します。
            - paragraph [ref=f5e414]: 具体的には、完了すべきタスクのリストを作成した上で、APIやロボティック‧システムを介してデジタル世界や物理世界でアクションを実行できることが期待されています。
            - paragraph [ref=f5e415]: エージェント型AIは、より⾼度で⾃律性の⾼い存在として位置付けられます。これは、AIが将来的にAGI（汎⽤⼈⼯知能）やASI（超知性）へと進化するという流れの中で、AIエージェントよりも包括的かつ進化的な概念として捉えることが妥当であるためです。
            - paragraph [ref=f5e416]: AIエージェントはエージェント型AIの1つとされており、チャットボット、RPA、AIエージェント、エージェント型AIの順に、その⾃律性や判断⼒に応じて段階的に進化しています。
            - paragraph [ref=f5e417]:
              - strong [ref=f5e418]: エージェント型AIは、ガートナーの2025年の戦略的テクノロジのトップ・トレンドの1つ
              - text: であり、責任あるイノベーションによって未来を形成する上で役立つと位置付けられています。
            - paragraph [ref=f5e419]: スケーラビリティと効率に対する需要が大きく、適応性が求められるワークフローにエージェント型AIを追加する機会を特定し、高品質なデータにアクセスでき、振る舞いの検証が可能なユースケースから小さく始めることが推奨されます。
        - heading "ステートフルとステートレスの違いとは？" [level=2] [ref=f5e423]
        - article [ref=f5e425]:
          - generic [ref=f5e426]:
            - paragraph [ref=f5e427]: AIエージェントを理解するうえで、ステートフルかステートレスかを区別することも重要です。
            - list [ref=f5e428]:
              - listitem [ref=f5e429]:
                - strong [ref=f5e430]: ステートフルなAIエージェント
                - text: ：過去の情報を保持し、それをもとによりパーソナライズされた応答や動作が可能
              - listitem [ref=f5e431]:
                - strong [ref=f5e432]: ステートレスなAIエージェント
                - text: ：以前のやり取りを保持せず、すべてのリクエストを独立したものとして扱う
        - heading "AIエージェントの仕組み" [level=2] [ref=f5e436]
        - article [ref=f5e438]:
          - paragraph [ref=f5e440]: AIエージェントは、目標を理解して、計画し、必要な道具（ツール）を使い、学習しながら作業を進める自動実行プログラムです。この一連の流れを安全・確実に回すために、フレームワークが「まとめ役（オーケストレーション）」として各部品をつないでいます。
        - heading "AIエージェントの頭脳となる主要な機能" [level=4] [ref=f5e444]
        - article [ref=f5e446]:
          - list [ref=f5e448]:
            - listitem [ref=f5e449]:
              - paragraph [ref=f5e450]:
                - strong [ref=f5e451]: 計画と推論
                - text: 目標を小さな手順に分解し、「今なにをやるか」を決めます。
            - listitem [ref=f5e452]:
              - paragraph [ref=f5e453]:
                - strong [ref=f5e454]: メモリ管理
                - text: 直前の会話や過去の知識を覚えておき、必要なときに取り出します。
            - listitem [ref=f5e455]:
              - paragraph [ref=f5e456]:
                - strong [ref=f5e457]: ツール利用
                - text: 検索、社内システムAPI、RAGなど、外部の力を呼び出します。
            - listitem [ref=f5e458]:
              - paragraph [ref=f5e459]:
                - strong [ref=f5e460]: 行動／観測ループ
                - text: 「観測 → 判断 → 行動 → 再観測」を繰り返し、目的に近づきます。
            - listitem [ref=f5e461]:
              - strong [ref=f5e462]: マルチエージェントの調整
              - text: 複数のエージェント（役割分担した担当者）が協力するときの連携ルールとなります。
        - heading "つなぐ部品となる主要な構成要素" [level=4] [ref=f5e466]
        - article [ref=f5e468]:
          - list [ref=f5e470]:
            - listitem [ref=f5e471]:
              - paragraph [ref=f5e472]:
                - strong [ref=f5e473]: オーケストレーション
                - text: まとめ役。セッション状態の管理、プロンプト送受信、LLM応答の解釈、必要なAPI呼び出し、メモリ参照、他エージェントとの連携を一手に担います。
            - listitem [ref=f5e474]:
              - strong [ref=f5e475]: マルチエージェント・ワークフロー
              - text: 役割別エージェントや各コンポーネントの手順書です。誰がいつ誰に渡すか、イベントで動くか、グラフ型に進むか、といった流れを定義します。
        - heading "拡張パーツとなる開発者向けの周辺機能" [level=4] [ref=f5e479]
        - article [ref=f5e481]:
          - list [ref=f5e483]:
            - listitem [ref=f5e484]:
              - paragraph [ref=f5e485]:
                - strong [ref=f5e486]: 組み込みツール
                - text: RAGや各種APIコネクタなど。エージェントに“手足”を与えます。
            - listitem [ref=f5e487]:
              - paragraph [ref=f5e488]:
                - strong [ref=f5e489]: メモリ
                - text: セッションをまたいだ文脈共有や、長期記憶（例：ベクトルDB）との連携。
            - listitem [ref=f5e490]:
              - paragraph [ref=f5e491]:
                - strong [ref=f5e492]: モデル統合／LLMコネクタ
                - text: 1つまたは複数のLLMと接続し、用途に応じて使い分けます。
            - listitem [ref=f5e493]:
              - paragraph [ref=f5e494]:
                - strong [ref=f5e495]: コード実行
                - text: 必要に応じて生成したコードをローカル／外部で実行し、能力を拡張します。
            - listitem [ref=f5e496]:
              - paragraph [ref=f5e497]:
                - strong [ref=f5e498]: 言語ランタイム
                - text: Python／JavaScript／.NET／Javaなど主要言語で実装できる互換層。
        - generic [ref=f5e503]:
          - article [ref=f5e505]:
            - paragraph [ref=f5e507]: ※ご入力は1分程度で完了いたします。
          - generic [ref=f5e510]:
